name: CI

on:
  push:
    branches: [main, ci-3-gate]  # TEMPORARY (CI-3 proof) — remove ci-3-gate before merging
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Not a `services:` container: GitHub Actions service containers run
      # the image's own CMD as-is with no way to override it, and the
      # installed azure-storage-blob SDK negotiates a newer Blob Storage
      # API version than the azurite:latest image currently supports —
      # every request 400s with "API version ... is not supported by
      # Azurite" otherwise. --skipApiVersionCheck is Azurite's own
      # documented fix (named in that same error message), so this starts
      # it directly with a `docker run` step instead.
      - name: Start Azurite
        run: |
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:latest \
            azurite --skipApiVersionCheck \
              --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              exit 0
            fi
            sleep 1
          done
          echo "Azurite did not become reachable in time" >&2
          exit 1

      - name: Lint (ruff)
        run: ruff check .

      # CI-3: a skipped test (pytest's own exit code is 0 for a run that
      # only skips, never fails) or a test quietly disappearing from
      # collection must not look like "everything ran and passed" — both
      # are checked explicitly below, each with its own distinct failure
      # so the three failure modes (a real test failure, a skip, an
      # under-collection) are never confused with one another in the log.
      - name: Test (pytest)
        shell: bash
        env:
          AZURITE_TEST_CONNECTION: UseDevelopmentStorage=true
          # Collected-test count with AZURITE_TEST_CONNECTION set and
          # Azurite reachable (0 skipped) as of 2026-10-08 — update when
          # adding tests.
          MIN_EXPECTED_TESTS: 444
        run: |
          set -uo pipefail
          pytest -rs 2>&1 | tee pytest-output.log
          pytest_exit=${PIPESTATUS[0]}
          echo "pytest exit code: $pytest_exit"

          collected=$(grep -oE '^collected [0-9]+ item' pytest-output.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "collected: ${collected:-<none found>} (minimum expected: $MIN_EXPECTED_TESTS)"

          status=0

          if grep -q '^SKIPPED ' pytest-output.log; then
            echo "::error::pytest reported at least one SKIPPED test — a skip must not count as a pass for this required check. See the SKIPPED lines above (printed because of -rs)."
            status=1
          fi

          if [ -z "$collected" ] || [ "$collected" -lt "$MIN_EXPECTED_TESTS" ]; then
            echo "::error::Collected ${collected:-0} tests, fewer than the expected minimum of $MIN_EXPECTED_TESTS — a test may have been deleted, or collection itself failed."
            status=1
          fi

          if [ "$pytest_exit" -ne 0 ]; then
            echo "::error::pytest exited with a non-zero code ($pytest_exit) — see failures above."
            status=1
          fi

          exit "$status"

      - name: Stop Azurite
        if: always()
        run: docker rm -f azurite

  # Single required check: green only when every job that runs tests,
  # lint, or contract checks actually ran and actually passed. `if:
  # always()` is what lets this job evaluate (and fail loudly) even when
  # `test` itself failed or was skipped — without it, a failed dependency
  # would skip `gate` too, and a skipped required check still counts as
  # "passing" for branch protection, defeating the entire point of this job.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Require every needed job to have succeeded
        run: |
          # Add every job name here that runs tests, lint, or contract
          # checks (not deploy jobs) whenever one is added to this
          # workflow. "skipped" counts as failure, same as "failure" or
          # "cancelled" — only an exact "success" passes.
          declare -A results=(
            [test]="${{ needs.test.result }}"
          )
          status=0
          for job in "${!results[@]}"; do
            echo "$job: ${results[$job]}"
            if [ "${results[$job]}" != "success" ]; then
              echo "::error::Required job '$job' did not succeed (result: ${results[$job]})"
              status=1
            fi
          done
          exit "$status"
